<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Votação encerrada</title>
<meta name="description" content="Esta votação foi encerrada. A votação atual é a dos novos kits de teclado e mouse da Pique.">
<meta name="theme-color" content="#0B0A09">
<meta name="robots" content="noindex">
<style>
:root{--fundo:#0B0A09;--texto:#F5F0EB;--suave:#B8AC9F;--ambar:#E89430;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--fundo)}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
h1{font-size:2rem;line-height:1.15;font-weight:600;margin:0;letter-spacing:-.02em}
p{margin:0;color:var(--suave)}
a{display:block;margin-top:8px;padding:16px;border-radius:8px;background:var(--ambar);color:#0B0A09;font-weight:600;text-align:center;text-decoration:none}
a:focus-visible{outline:3px solid var(--texto);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Esta votação foi encerrada</h1>
  <p>A votação certa agora é a dos novos kits de teclado e mouse da Pique.</p>
  <a href="https://contatogsfilmes-design.github.io/votacao-kit-pique/">Ir para a votação da Pique</a>
</main>
</body>
</html>
